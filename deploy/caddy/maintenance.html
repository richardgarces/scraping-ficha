<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090b10">
  <title>Precios — actualizando</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #141821;
      --line: #2a3142;
      --text: #f4f6fb;
      --muted: #8b95a8;
      --accent: #3ee0a0;
      --glow-1: #163528;
      --glow-2: #1a2038;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 480px at 8% -10%, var(--glow-1) 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, var(--glow-2) 0%, transparent 50%),
        var(--bg);
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .card {
      width: min(440px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      text-align: center;
    }
    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1a3a2c, #123528);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.04em;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
    }
    h1 {
      margin: 6px 0 12px;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .hint {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="mark" aria-hidden="true">P</div>
      <p class="eyebrow">Precios</p>
      <h1>Estamos actualizando la página</h1>
      <p>Vuelve en unos minutos. Estamos desplegando una nueva versión de Precios.</p>
      <p class="hint">Si el problema continúa, prueba más tarde.</p>
    </div>
  </main>
</body>
</html>
