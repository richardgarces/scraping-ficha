<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#258fdf">
  <title>Super ofertas</title>
  <script>(function(){var m=localStorage.getItem("retail-theme");if(m==="day"||m==="night"){document.documentElement.dataset.theme=m;return;}var h=new Date().getHours();document.documentElement.dataset.theme=(h>=7&&h<19)?"day":"night";})();</script>
  <link rel="stylesheet" href="/static/styles.css?v=78-pager">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Retail Chile</p>
      <h1>Super ofertas</h1>
    </div>
    <form class="desktop-quick-search" action="/catalogo" method="get" role="search">
      <label class="desktop-search-field"><span class="sr-only">Buscar un producto</span><input name="q" type="search" placeholder="Busca un producto…"></label>
      <label class="quick-search-toggle" title="Buscar solo en la base de datos"><input name="quick" type="checkbox" value="1" checked><span class="quick-search-long">Búsqueda rápida</span><span class="quick-search-short">Rápida</span></label>
      <button type="submit" aria-label="Buscar">Buscar</button>
    </form>
    <nav class="nav">
      <a href="/">Explorar</a>
      <a href="/catalogo">Catálogo</a>
      <a href="/hoy">Ofertas de hoy</a>
      <a href="/reales" class="current">Ofertas reales</a>
      <a href="/tiendas">Tiendas</a>
      <details class="nav-menu" data-login>
        <summary>Cuenta</summary>
        <div class="nav-menu-list">
          <a href="/entrar" data-login-mode="entrar">Entrar</a>
          <a href="/entrar?modo=inscribir" data-login-mode="inscribir">Inscribirse</a>
        </div>
      </details>
      <details class="nav-menu" data-auth hidden>
        <summary data-user-label>Cuenta</summary>
        <div class="nav-menu-list">
          <a href="/siguiendo">Siguiendo</a>
          <a href="/cron" data-admin hidden>Cron / lotes</a>
          <a href="/analisis-producto" data-admin hidden>Análisis de producto</a>
          <a href="/estadisticas" data-admin hidden>Estadísticas</a>
          <a href="/usuarios" data-admin hidden>Usuarios</a>
          <a href="/ofertas" data-admin hidden>Configurar</a>
          <a href="#" data-logout>Salir</a>
        </div>
      </details>
    </nav>
    <div class="theme-toggle" role="group" aria-label="Apariencia">
      <button type="button" class="secondary" data-theme-set="auto" title="Según la hora y tu ubicación">Auto</button>
      <button type="button" class="secondary" data-theme-set="day">Día</button>
      <button type="button" class="secondary" data-theme-set="night">Noche</button>
    </div>
  </header>

  <section class="catalog-filter-strip" aria-label="Filtros de super ofertas">
    <details id="super-filters" class="collapsible-filters">
      <summary>
        <span class="filter-summary-title">Filtros</span>
        <span id="super-filter-count" class="filter-count">Sin filtros</span>
        <span class="filter-toggle-label" aria-hidden="true"></span>
      </summary>
      <div class="toolbar catalog-filter-grid compact-filter-grid">
        <label>Categoría <select id="category" data-filter-control></select></label>
        <label>Tienda de la oferta <select id="store" data-filter-control></select></label>
        <label>Mostrar
          <select id="size" data-filter-control data-filter-default="40">
            <option value="24">24</option>
            <option value="40" selected>40</option>
            <option value="80">80</option>
          </select>
        </label>
      </div>
    </details>
  </section>

  <main class="settings">
    <p id="flash" class="summary" hidden></p>
    <p id="summary" class="filter-summary"></p>
    <p id="timesfm-summary" class="timesfm-summary muted" data-admin hidden></p>

    <section id="deals" class="deal-grid"></section>

    <section class="panel pager simple-pager" aria-label="Paginación de super ofertas">
      <button type="button" id="prev" class="secondary" aria-label="Ir a la página anterior">Anterior</button>
      <span id="page-label" class="muted"></span>
      <button type="button" id="next" class="secondary" aria-label="Ir a la página siguiente">Siguiente</button>
    </section>
  </main>
  <script src="/static/prices.js?v=30"></script>
  <script src="/static/pagination.js?v=1"></script>
  <script src="/static/super.js?v=11-pager"></script>
</body>
</html>
