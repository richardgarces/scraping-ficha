# Worker slim en soyo: solo imagen app (sin mongo/redis/qdrant locales).
# Preferido para cron: venv + scripts/ofertas-diarias-soyo.sh (sin Docker).
# Este compose sirve para smoke/manual con la misma imagen de prod.
#
# Requisitos: .env en soyo con MONGODB_URI / REDIS_URL → BMAX (VPN).
#
# Ejemplo smoke:
#   docker compose -f docker-compose.worker.soyo.yml run --rm worker \
#     retail batch --grupo farmacias --source scrape --pausa 3 --presupuesto-minutos 15

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precios-worker-soyo
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # No pisar MONGODB_URI/REDIS_URL del .env (deben apuntar a BMAX).
    volumes:
      - ./retail/batch/programacion.json:/app/retail/batch/programacion.json
      - ./retail/batch/reglas_ofertas.json:/app/retail/batch/reglas_ofertas.json
      - ./output:/app/output
      - ./logs:/app/logs
    # Contenedor idle; el cron host llama al venv, o usa:
    #   docker compose -f docker-compose.worker.soyo.yml run --rm worker retail …
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # Cyber Day loop en soyo (scrape hacia tiendas; Mongo/Redis en BMAX).
  # Si corre aquí, conviene parar precios-cyber-worker en BMAX para no duplicar.
  cyber-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precios-cyber-worker-soyo
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CYBER_DAY_DELAY_SECONDS: ${CYBER_DAY_DELAY_SECONDS:-1.0}
      CYBER_DAY_TOP_MATCHES: ${CYBER_DAY_TOP_MATCHES:-6}
      CYBER_DAY_REFRESH_TOP: ${CYBER_DAY_REFRESH_TOP:-2}
      CYBER_DAY_SEARCH_MAX_ITEMS: ${CYBER_DAY_SEARCH_MAX_ITEMS:-3}
      CYBER_DAY_SEARCH_SOURCE: ${CYBER_DAY_SEARCH_SOURCE:-db}
      CYBER_DAY_SEARCH_TIMEOUT: ${CYBER_DAY_SEARCH_TIMEOUT:-6}
    volumes:
      - ./data/cyber_day_sonic.json:/app/data/cyber_day_sonic.json:ro
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "-m", "retail.cyber_day"]
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-m", "retail.cyber_day", "--healthcheck"]
      interval: 30s
      timeout: 12s
      retries: 4
      start_period: 40s
