[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail"
version = "2.0.0"
description = "Scrapers de retail chileno"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "curl_cffi>=0.7.0",
    "numpy>=1.26.0",
    "pymongo>=4.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "qdrant-client>=1.12.0",
    "pillow>=10.0.0",
    "redis>=5.0.0",
    "pywebpush>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
documents = [
    "docling>=2.70.0,<3",
]
screenshots = [
    "playwright>=1.40.0",
]

[project.scripts]
retail = "retail.cli:unified_main"
