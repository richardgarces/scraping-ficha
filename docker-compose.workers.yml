version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  discoverer:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SITEMAP_URLS=${SITEMAP_URLS}
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WORKER_CONCURRENCY=4
      - RUNNER_PATH=/usr/local/bin/worker/runner.py
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=product_vectors
      - EMBEDDING_URL=http://embedding:8080/embeddings
      - RENDERER_URL=http://splash:8050
    depends_on:
      - redis
      - qdrant
      - embedding
      - splash
    deploy:
      replicas: 3

  qdrant:
    image: qdrant/qdrant:v1.2.2
    ports:
      - '6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage
  splash:
    image: scrapinghub/splash
    ports:
      - '8050:8050'
    restart: unless-stopped
  embedding:
    build:
      context: ./worker/embedding
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    ports:
      - '8080:8080'

volumes:
  redis-data:
  qdrant-data:
