<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar producto</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:20px}label{display:block;margin-top:8px}textarea{width:100%;height:220px}</style>
</head>
<body>
  <h1>Editar {{ doc.store }} / {{ doc.product_id }}</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
      {% for cat, msg in messages %}
        <li>{{ msg }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Nombre<br><input name="name" value="{{ doc.name or '' }}"></label>
    <label>Brand<br><input name="brand" value="{{ doc.brand or '' }}"></label>
    <label>Rating<br><input name="rating" value="{{ doc.rating or '' }}"></label>
    <label>Reviews<br><input name="reviews" value="{{ doc.reviews or '' }}"></label>
    <label>Especificaciones (JSON)<br><textarea name="specs">{{ doc.specifications | tojson(indent=2) if doc.specifications else '{}' }}</textarea></label>
    <p><button type="submit">Guardar</button> <a href="/admin">Volver</a></p>
  </form>
</body>
</html>
