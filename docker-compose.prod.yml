# Producción — Comparador retail (precios.meincart.com)
# Secretos: copiar .env.production.example → .env en el servidor.
# Deploy: EDGE=platform ./scripts/deploy-prod.sh

services:
  mongo:
    image: mongo:7
    container_name: precios-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-scraping}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: precios-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: precios-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precios-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Hostnames = container_name (el alias "redis" en platform-net es platform-redis con AUTH)
      MONGODB_URI: mongodb://precios-mongo:27017
      MONGODB_DB: ${MONGODB_DB:-scraping}
      QDRANT_URL: http://precios-qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-products}
      REDIS_URL: redis://precios-redis:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./retail/batch:/app/retail/batch
      - ./output:/app/output
      - ./logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
