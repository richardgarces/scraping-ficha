# Producción — Comparador retail (precios.meincart.com)
# Secretos: copiar .env.production.example → .env en el servidor.
# Deploy: EDGE=platform ./scripts/deploy-prod.sh

services:
  mongo:
    image: mongo:7
    container_name: precios-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-scraping}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: precios-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: precios-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      # Producción incluye Playwright/Chromium para OFFER_SCREENSHOTS=1.
      dockerfile: Dockerfile.screenshots
    container_name: precios-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Hostnames = container_name (el alias "redis" en platform-net es platform-redis con AUTH)
      MONGODB_URI: mongodb://precios-mongo:27017
      MONGODB_DB: ${MONGODB_DB:-scraping}
      QDRANT_URL: http://precios-qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-products}
      REDIS_URL: redis://precios-redis:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      # Solo JSON editables en el host. El .py del batch (p. ej. basic_scrape) va
      # en la imagen con mongo.py: si se monta todo retail/batch, un push sin
      # rebuild deja el caller con after_id y el ProductRepository viejo sin él.
      - ./retail/batch/programacion.json:/app/retail/batch/programacion.json
      - ./retail/batch/reglas_ofertas.json:/app/retail/batch/reglas_ofertas.json
      - ./output:/app/output
      - ./logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s

  real-offer-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precios-real-offer-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://precios-mongo:27017
      MONGODB_DB: ${MONGODB_DB:-scraping}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "retail.real_offer_worker"]
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-m", "retail.real_offer_worker", "--healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s

  # Loop Cyber Day (queries Sonic). Preferible en soyo si el scrape pesa;
  # en BMAX comparte Mongo con la web. Un solo worker activo vía heartbeat.
  cyber-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precios-cyber-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # No pisar MONGODB_URI del .env (en BMAX lleva auth precios_soyo).
      MONGODB_DB: ${MONGODB_DB:-scraping}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CYBER_DAY_DELAY_SECONDS: ${CYBER_DAY_DELAY_SECONDS:-2.5}
      CYBER_DAY_TOP_MATCHES: ${CYBER_DAY_TOP_MATCHES:-6}
      CYBER_DAY_REFRESH_TOP: ${CYBER_DAY_REFRESH_TOP:-3}
      CYBER_DAY_SEARCH_MAX_ITEMS: ${CYBER_DAY_SEARCH_MAX_ITEMS:-4}
    command: ["python", "-m", "retail.cyber_day"]
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-m", "retail.cyber_day", "--healthcheck"]
      interval: 30s
      timeout: 12s
      retries: 4
      start_period: 40s

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
