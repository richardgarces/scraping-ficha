# Browser challenge solver for the soyo host worker (loopback only).
services:
  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:v3.5.2}
    container_name: precios-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      TZ: America/Santiago
    ports:
      - "127.0.0.1:8191:8191"
    mem_limit: 2g
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
